<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perry meeting</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2f2f4;background:transparent}main{display:flex;align-items:center;gap:16px;min-height:104px;padding:20px;border:1px solid #38383b;border-radius:24px;background:#202022;box-shadow:0 4px 12px #0003}svg{flex-shrink:0}.camera{color:#f4c43c}.copy{flex:1;min-width:0}h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}p{display:flex;align-items:center;gap:7px;margin:4px 0 0;color:#b7b7be;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:7px;height:7px;border-radius:2px;background:#26bc91;flex-shrink:0}.actions{display:flex;flex-shrink:0;border:1px solid #dedfc6;border-radius:12px;background:#ffffe9;overflow:hidden}button{min-height:48px;border:0;background:transparent;color:#202022;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0 14px}button:hover{background:#ededd5}button:focus-visible{outline:2px solid #0c7a70;outline-offset:-4px}#start{display:flex;align-items:center;gap:10px;font-family:inherit;font-size:14px;font-weight:600}#menu{min-width:44px;border-left:1px solid #d0d0bd;padding:0 12px}#start svg{background:#202022;color:#ffffe9;padding:6px;border-radius:7px;width:30px;height:30px}[hidden]{display:none!important}@media(prefers-color-scheme:light){body{color:#1d1d1f}main{background:#fff;border-color:#dedee3}p{color:#66666b}.actions{background:#f4f5df}}@media(max-width:520px){main{gap:10px;padding:16px}#start{gap:6px;padding:0 10px}#start svg{display:none}.camera{display:none}h1{font-size:15px}}
</style>
</head>
<body><main hidden role="status" aria-live="polite">
<svg class="camera" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="m17 9 5-3v12l-5-3z"/></svg>
<div class="copy"><h1>Meeting detected</h1><p><span class="dot"></span><span id="detail">Now</span></p></div>
<div class="actions"><button id="start" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4m4-8v12m4-15v18m4-14v10m4-7v4"/></svg>Start Notetaker</button><button id="menu" type="button" aria-label="More meeting options" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button></div>
</main><script src="meeting-notice-page.js"></script></body></html>
