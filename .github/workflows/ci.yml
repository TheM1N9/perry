# Install, typecheck and smoke-test the runner on each OS Perry supports.
# Needs no secrets: the smoke test (scripts/smoke.ts) uses no deployment and no Codex.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p convex
      - run: pnpm exec tsc --noEmit
      # On Windows the runner is disposable, so the smoke test also has Task Scheduler read the task it would install.
      - run: bun scripts/smoke.ts ${{ runner.os == 'Windows' && '--register' || '' }}
