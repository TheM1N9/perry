# Install, typecheck and smoke-test the runner on each OS Perry supports.
# Needs no secrets: the smoke test (scripts/smoke.ts) uses no server and no engine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: git diff --exit-code -- convex/_generated/api.d.ts server/modules.ts
      - run: pnpm exec node artifacts/macos-git-preflight/run.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: installer-git-preflight-${{ runner.os }}
          path: artifacts/macos-git-preflight/result.json
          if-no-files-found: ignore
      - run: pnpm exec tsc --noEmit -p convex
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc --noEmit -p artifacts
      - run: pnpm build
      - name: Verify Markdown image loading
        if: runner.os == 'Windows'
        id: markdown_images
        timeout-minutes: 3
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/markdown-images/run.mjs "${{ runner.temp }}/markdown-images"
      - if: always() && runner.os == 'Windows' && steps.markdown_images.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: markdown-images-${{ runner.os }}
          path: ${{ runner.temp }}/markdown-images/result.json
          if-no-files-found: error
      - name: Verify indexed recovery and chat history reads
        id: indexed_reads
        timeout-minutes: 3
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/trace-settlement/run.ts
      - if: always() && steps.indexed_reads.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: indexed-reads-${{ runner.os }}
          path: node_modules/.cache/performance-backend/results/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/library/lifecycle.mjs "${{ runner.temp }}/library-lifecycle"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: library-lifecycle-${{ runner.os }}
          path: ${{ runner.temp }}/library-lifecycle/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/internet-routing/run.ts
        env:
          PERRY_E2E_OUTPUT: ${{ runner.temp }}/permission-boundary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: permission-boundary-${{ runner.os }}
          path: ${{ runner.temp }}/permission-boundary/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/message-lifecycle/run.ts
        env:
          PERRY_E2E_OUTPUT: ${{ runner.temp }}/chat-lifecycle/message
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/parallel-sessions/run.ts
        env:
          PERRY_E2E_OUTPUT: ${{ runner.temp }}/chat-lifecycle/parallel
      - if: runner.os == 'Windows'
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/machine-lifecycle/run.mjs "${{ runner.temp }}/machine-lifecycle"
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: machine-lifecycle-${{ runner.os }}
          path: ${{ runner.temp }}/machine-lifecycle/result.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: chat-lifecycle-${{ runner.os }}
          path: ${{ runner.temp }}/chat-lifecycle
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/job-share-file/run.mjs "${{ runner.temp }}/job-share-file"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: job-share-file-${{ runner.os }}
          path: ${{ runner.temp }}/job-share-file/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/unattended-work/run.mjs "${{ runner.temp }}/unattended-work"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: unattended-work-${{ runner.os }}
          path: ${{ runner.temp }}/unattended-work/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/task-presence/run.mjs "${{ runner.temp }}/task-presence"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: task-presence-${{ runner.os }}
          path: ${{ runner.temp }}/task-presence/result.json
          if-no-files-found: error
      - run: pnpm exec bun artifacts/auto-routing/run.ts "${{ runner.temp }}/engine-protocol" --protocol-only
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: engine-protocol-${{ runner.os }}
          path: ${{ runner.temp }}/engine-protocol/result.json
          if-no-files-found: error
      - if: runner.os == 'Windows'
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/computer-control/stream-reconnect.mjs "${{ runner.temp }}/stream-reconnect"
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: stream-reconnect-${{ runner.os }}
          path: ${{ runner.temp }}/stream-reconnect/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-strip-types artifacts/pr-300/stream-integration.mjs
      - run: pnpm exec node artifacts/pr-300/file-render-integration.mjs
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/security-audit-20261028/loader.mjs artifacts/security-audit-20261028/run.mjs
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/security-audit-20261028/loader.mjs artifacts/security-audit-20261028/client-replay.mjs
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/security-audit-20261028/loader.mjs artifacts/security-audit-20261028/lifecycle-replay.mjs
      - name: Verify automatic Brain saves
        id: automatic_brain
        timeout-minutes: 3
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/memory-capture/automatic.mjs "${{ runner.temp }}/automatic-brain"
      - name: Verify WhatsApp progress delivery
        id: whatsapp_progress
        timeout-minutes: 3
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/whatsapp-progress/run.mjs "${{ runner.temp }}/whatsapp-progress"
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - name: Verify native progress adapters
        id: progress_adapters
        timeout-minutes: 3
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/whatsapp-progress/adapters.mjs "${{ runner.temp }}/progress-adapters"
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - name: Verify ACP progress adapters
        id: acp_progress
        timeout-minutes: 3
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/whatsapp-progress/acp.mjs "${{ runner.temp }}/acp-progress"
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - if: always() && (steps.whatsapp_progress.outcome != 'skipped' || steps.progress_adapters.outcome != 'skipped' || steps.acp_progress.outcome != 'skipped')
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: whatsapp-progress-${{ runner.os }}
          path: |
            ${{ runner.temp }}/whatsapp-progress/result.json
            ${{ runner.temp }}/progress-adapters/result.json
            ${{ runner.temp }}/acp-progress/result.json
          if-no-files-found: error
      - name: Verify Full access approvals
        id: full_access_approvals
        timeout-minutes: 3
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/tool-approval-routing/full-access.ts "${{ runner.temp }}/full-access-approvals"
      - if: always() && (steps.automatic_brain.outcome != 'skipped' || steps.full_access_approvals.outcome != 'skipped')
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: automatic-brain-full-access-${{ runner.os }}
          path: |
            ${{ runner.temp }}/automatic-brain/result.json
            ${{ runner.temp }}/full-access-approvals/result.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: security-remediation-${{ runner.os }}
          path: |
            artifacts/security-audit-20261028/result.json
            artifacts/security-audit-20261028/client-result.json
            artifacts/security-audit-20261028/lifecycle-result.json
            artifacts/security-audit-20261028/function-inventory-result.json
            artifacts/security-audit-20261028/indexes-result.json
          if-no-files-found: ignore
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/orphan-tasks/run.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: orphan-tasks-${{ runner.os }}
          path: artifacts/orphan-tasks/result.json
          if-no-files-found: ignore
      # Files people send in group and contact chats reach the turn, and its engine gets page pictures and text
      # it can read with no tools (artifacts/guest-files/failure-cases.md).
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/guest-files/run.mjs "${{ runner.temp }}/guest-files"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: guest-files-${{ runner.os }}
          path: ${{ runner.temp }}/guest-files
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/jobs-inherit-access/run.mjs "${{ runner.temp }}/jobs-inherit-access"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: jobs-inherit-access-${{ runner.os }}
          path: ${{ runner.temp }}/jobs-inherit-access/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/guest-reactions/run.mjs "${{ runner.temp }}/guest-reactions"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: guest-reactions-${{ runner.os }}
          path: ${{ runner.temp }}/guest-reactions/result.json
          if-no-files-found: error
      # internet_scroll end to end over MCP, with recorded answers for the internet (artifacts/scroll/failure-cases.md).
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/scroll/run.mjs "${{ runner.temp }}/scroll"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: scroll-${{ runner.os }}
          path: ${{ runner.temp }}/scroll/result.json
          if-no-files-found: error
      # Logic checked on its own, without a browser or the network (components/**/*.test.ts, artifacts/scroll/*.test.ts).
      - run: pnpm test
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/worker-webhook/run.mjs "${{ runner.temp }}/worker-webhook"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: worker-webhook-${{ runner.os }}
          path: ${{ runner.temp }}/worker-webhook/result.json
          if-no-files-found: error
      - run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/folder-trigger-queue/run.mjs "${{ runner.temp }}/folder-trigger-queue"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: folder-trigger-queue-${{ runner.os }}
          path: ${{ runner.temp }}/folder-trigger-queue/result.json
          if-no-files-found: error
      # On Windows the runner is disposable, so the smoke test also has Task Scheduler read the task it would install.
      - run: bun scripts/smoke.ts ${{ runner.os == 'Windows' && '--register' || '' }}
      - if: runner.os == 'Windows'
        run: bun artifacts/windows-background/run.ts "${{ runner.temp }}/windows-background"
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: windows-background
          path: ${{ runner.temp }}/windows-background
          if-no-files-found: ignore
      # perry setup never picks the default engine (issue #190): it refuses with no one to answer and no --engine,
      # takes --engine or PERRY_ENGINE without asking, and asks with scripted answers. Stand-in CLIs only, nothing
      # installed for real (artifacts/choose-engine).
      - run: bun artifacts/choose-engine/run.ts "${{ runner.temp }}/choose-engine" --setup-only
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: choose-engine-${{ runner.os }}
          path: ${{ runner.temp }}/choose-engine
          if-no-files-found: ignore
      - if: runner.os == 'Windows'
        run: pnpm exec bun artifacts/choose-engine/run.ts "${{ runner.temp }}/first-use" --first-use-only
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - if: runner.os == 'Windows'
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/settings-recovery/run.ts "${{ runner.temp }}/settings-recovery"
      - if: runner.os == 'Windows'
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/settings-recovery/navigation.ts "${{ runner.temp }}/settings-navigation"
      - if: runner.os == 'Windows'
        run: pnpm exec bun artifacts/auto-routing/run.ts "${{ runner.temp }}/engine-readiness" --readiness-only
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - if: runner.os == 'Windows'
        run: pnpm exec bun artifacts/auto-routing/run.ts "${{ runner.temp }}/engine-model-recovery" --model-recovery-only
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - if: runner.os == 'Windows'
        run: pnpm exec bun artifacts/engine-update/run.ts "${{ runner.temp }}/engine-update"
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
      - if: runner.os == 'Windows'
        run: pnpm exec bun artifacts/connector-accounts/run.ts "${{ runner.temp }}/connector-accounts" --stand-in
      - if: runner.os == 'Windows'
        run: pnpm exec bun artifacts/connector-details/run.ts "${{ runner.temp }}/connector-details"
      - name: Prepare browser verification driver
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          $taskBrowserTools = Join-Path $env:RUNNER_TEMP 'task-presence-browser-tools'
          New-Item -ItemType Directory -Force -Path $taskBrowserTools | Out-Null
          Set-Content -LiteralPath (Join-Path $taskBrowserTools 'package.json') -Value '{"private":true,"type":"module"}'
          pnpm --dir $taskBrowserTools add --ignore-scripts --save-exact playwright@1.62.1
      - name: Verify task execution display and owner controls
        if: runner.os == 'Windows'
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/task-presence/browser.ts "${{ runner.temp }}/task-presence-browser"
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
          PERRY_E2E_PLAYWRIGHT: ${{ runner.temp }}/task-presence-browser-tools/node_modules/playwright/index.mjs
          PERRY_E2E_BROWSER: C:/Program Files/Google/Chrome/Application/chrome.exe
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: task-presence-browser-${{ runner.os }}
          path: ${{ runner.temp }}/task-presence-browser
          if-no-files-found: error
      - name: Verify dashboard read recovery
        id: page_recovery
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: pnpm exec node --experimental-transform-types --import ./artifacts/secrets-at-rest/node-loader.mjs artifacts/page-recovery/run.ts "${{ runner.temp }}/page-recovery"
        env:
          PERRY_E2E_DIR: ${{ runner.temp }}
          PERRY_E2E_PLAYWRIGHT: ${{ runner.temp }}/task-presence-browser-tools/node_modules/playwright/index.mjs
          PERRY_E2E_BROWSER: C:/Program Files/Google/Chrome/Application/chrome.exe
      - if: always() && runner.os == 'Windows' && steps.page_recovery.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: page-recovery-${{ runner.os }}
          path: ${{ runner.temp }}/page-recovery
          if-no-files-found: error
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: first-use-settings-${{ runner.os }}
          path: |
            ${{ runner.temp }}/first-use
            ${{ runner.temp }}/settings-recovery/result.json
            ${{ runner.temp }}/settings-navigation/result.json
            ${{ runner.temp }}/engine-readiness
            ${{ runner.temp }}/engine-model-recovery
            ${{ runner.temp }}/engine-update
            ${{ runner.temp }}/connector-accounts
            ${{ runner.temp }}/connector-details
          if-no-files-found: error
      # The desktop pet looking at the screen on a Mac (issue #152), with no Screen Recording permission: what he
      # says to allow, the window in front, and how `perry pet` starts him (artifacts/screen-look/look.ts).
      - if: runner.os == 'macOS'
        run: pnpm install --dir pet --frozen-lockfile
      - if: runner.os == 'macOS'
        run: bun artifacts/screen-look/look.ts "$RUNNER_TEMP/screen-look"
      - if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: screen-look-macos
          path: ${{ runner.temp }}/screen-look
          if-no-files-found: ignore

  # The landing page in site/ is a separate Next.js app with its own lockfile.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
