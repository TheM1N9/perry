<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Perry — launch spot</title>
<style>
  @font-face { font-family: 'InterTight'; src: url(fonts/InterTight-var.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JBMono'; src: url(fonts/JetBrainsMono-var.woff2) format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); cursor: pointer; }
  #hint { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; color: #888; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">click to play · space to pause · ← → to scrub</div>
<script>
// ============================================================================
//  PERRY — launch spot. 128 BPM, 18 bars, 33.75 s @ 60 fps.
//  Styled with the site's system: white paper, ink type, teal accent,
//  Telegram mockups over Perry's doodle wallpaper. No glows, no grids.
// ============================================================================
const W = 1920, H = 1080, FPS = 60, SUB = 4;
const K = W / 1440, VW = 1440, VH = 810;
const BT = 60 / 128, BAR = 4 * BT, DUR = 18 * BAR;
window.FPS_ = FPS; window.DUR_ = DUR; window.SUB_ = SUB;

const T = {
  paper: '#ffffff', mist: '#f5f5f7', ink: '#1d1d1f', ink2: '#424245', ink3: '#6e6e73', hair: 'rgba(0,0,0,.09)',
  teal: '#0c7a70', night: '#0a0c0f', nightTeal: '#5fd4c8', nightText: '#a1a1a6',
  tgIn: '#ffffff', tgOut: '#effdde', tgMeta: '#687480', tgOutMeta: '#357d32', tgLink: '#2f89e0',
  tgnHead: '#17212b', tgnIn: '#182533', tgnOut: '#2b5278', tgnMeta: '#8fa3b8',
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
function bezier(x1, y1, x2, y2) {

// the site's own curves
const EZ = { blur: bezier(.25, .46, .45, .94), rise: bezier(.165, .84, .44, 1), whip: bezier(.72, 0, .18, 1) };
// motion's spring { stiffness: 420, damping: 32 }, the bubbles' pop
const SPRING = (() => { const w = Math.sqrt(420), z = 32 / (2 * w), wd = w * Math.sqrt(1 - z * z);
  return t => t <= 0 ? 0 : 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t)); })();

const view = document.getElementById('c'), out = view.getContext('2d');
const mk = (w = W, h = H) => { const cv = document.createElement('canvas'); cv.width = Math.round(w); cv.height = Math.round(h); return cv; };
const scratch = mk(), sctx = scratch.getContext('2d');
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };

const sans = (w, s) => `${w} ${s}px InterTight`, mono = (w, s) => `${w} ${s}px JBMono`;
function text(c, s, x, y, font, col, o = {}) {

  c.letterSpacing = o.ls || '0px'; c.fillText(s, x, y); c.letterSpacing = '0px';
}
function tnum(c, s, x, y, font, col, o = {}) {
  c.font = font; c.letterSpacing = '0px'; c.fillStyle = col; c.textBaseline = o.base || 'alphabetic';
  const cell = Math.max(...'0123456789'.split('').map(d => c.measureText(d).width));
  const adv = ch => (/\d/.test(ch) ? cell : c.measureText(ch).width), chars = [...s], total = chars.reduce((a, ch) => a + adv(ch), 0);

}
function wrap(c, s, font, maxW, ls = '0px') {

  for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); c.letterSpacing = '0px'; return lines;
}
// headline words come into focus in turn (the site's BlurWords)
function blurWords(c, lines, x, y0, size, lh, t, t0, o = {}) {
  const font = sans(o.w || 600, size), ls = `${-(o.track ?? .04) * size}px`;
  c.font = font; c.letterSpacing = ls; const sp = c.measureText(' ').width;
  let i = 0;
  lines.forEach((line, li) => {
    c.font = font; c.letterSpacing = ls;
    const words = line.split(' '), ws = words.map(w => c.measureText(w).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
    let cx = o.align === 'center' ? x - tot / 2 : x;
    words.forEach((wd, k) => {

      if (p > 0) {
        c.save(); c.globalAlpha *= p; if (p < .98) c.filter = `blur(${(1 - p) * 10 * K}px)`;
        c.font = font; c.letterSpacing = ls; c.fillStyle = o.color || T.ink; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
        c.fillText(wd, cx, y0 + li * lh + (1 - p) * .18 * size); c.restore();

}
// rises into place once (the site's Reveal)
function rise(c, t, t0, draw, dist = 20, d = .7) {
  const p = EZ.rise(P(t, t0, t0 + d)); if (p <= 0) return;
  c.save(); c.globalAlpha *= p; c.translate(0, (1 - p) * dist); draw(); c.restore();

// ============================================================================
//  Telegram, day and night, over Perry's own doodle wallpaper
// ============================================================================
const PATTERN = new Image(); PATTERN.src = 'assets/tg-pattern.svg';
const WALL = new Map();
function wallpaper(theme, w, h) {
  const key = `${theme}${w}x${h}`; if (WALL.has(key)) return WALL.get(key);
  const cv = mk(w * K, h * K), g = cv.getContext('2d'); g.scale(K, K);
  const tile = mk(168 * K, 168 * K), tg = tile.getContext('2d'); tg.drawImage(PATTERN, 0, 0, 168 * K, 168 * K);
  if (theme === 'day') {
    g.fillStyle = '#dbddbb'; g.fillRect(0, 0, w, h);
    for (const [px, py, rx, ry, col] of [[.15, .2, .6, .5, '213,216,141'], [.85, .3, .6, .6, '136,184,132'], [.3, .9, .7, .6, '107,165,135']]) {
      g.save(); g.translate(px * w, py * h); g.scale(rx * w, ry * h);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1); gr.addColorStop(0, `rgba(${col},1)`); gr.addColorStop(.7, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(-1, -1, 2, 2); g.restore();
    }
    tg.globalCompositeOperation = 'source-in'; tg.fillStyle = 'rgba(29,59,42,.16)'; tg.fillRect(0, 0, tile.width, tile.height);
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = g.createPattern(tile, 'repeat'); g.fillRect(0, 0, cv.width, cv.height);
  } else {
    g.fillStyle = '#0c1013'; g.fillRect(0, 0, w, h);
    const lay = mk(w * K, h * K), lg = lay.getContext('2d');
    const a = 160 * Math.PI / 180, cx = lay.width / 2, cy = lay.height / 2, L = Math.hypot(lay.width, lay.height) / 2;
    const gr = lg.createLinearGradient(cx - Math.sin(a) * L, cy + Math.cos(a) * L, cx + Math.sin(a) * L, cy - Math.cos(a) * L);
    gr.addColorStop(0, '#2e7d6f'); gr.addColorStop(.45, '#2b5f86'); gr.addColorStop(.75, '#4b4f9a'); gr.addColorStop(1, '#2f7a74');
    lg.fillStyle = gr; lg.fillRect(0, 0, lay.width, lay.height);
    lg.globalCompositeOperation = 'destination-in'; lg.fillStyle = lg.createPattern(tile, 'repeat'); lg.fillRect(0, 0, lay.width, lay.height);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = .22; g.drawImage(lay, 0, 0);
  }
  WALL.set(key, cv); return cv;
}
// rich text runs: [text, mono?]
function layoutRuns(c, runs, maxW) {

    lines.at(-1).push(tk); lw += tk.w;
  }
  const widths = lines.map(l => l.reduce((a, t) => a + t.w, 0));
  return { lines, width: Math.max(...widths) };
}
const LH = 15 * 1.36;
function measureItem(c, it, colW) {
  if (it.kind === 'bubble') {
    const L = layoutRuns(c, it.runs, colW * .84 - 24);
    c.font = sans(400, 11.5); const tw = c.measureText(it.time).width + (it.side === 'out' ? 20 : 0);
    it._L = L; it.w = Math.max(L.width, tw) + 24; it.h = 7 + L.lines.length * LH + 19;
  } else if (it.kind === 'typing') { it.w = 57; it.h = 31; }
  else if (it.kind === 'pill') { c.font = sans(500, 12.5); it.w = c.measureText(it.text).width + 20; it.h = 22; }
  else if (it.kind === 'keys') { it.w = colW * .84; it.h = 36; }
  else if (it.kind === 'kbd') { it.w = colW; it.h = it.labels.length * 40 - 4; }
}
function drawBubble(c, it, x, y, theme) {

  c.save();
  if (!night) { c.shadowColor = 'rgba(0,0,0,.13)'; c.shadowOffsetY = 1 * K; c.shadowBlur = 1 * K; }
  c.fillStyle = out ? (night ? T.tgnOut : T.tgOut) : (night ? T.tgnIn : T.tgIn);
  rr(c, x, y, it.w, it.h, out ? [17, 17, 5, 17] : [17, 17, 17, 5]); c.fill(); c.restore();
  const col = night ? '#fff' : '#000';
  it._L.lines.forEach((line, li) => {
    let cx = x + 12;
    for (const tk of line) { c.font = tk.m ? mono(500, 13.5) : sans(400, 15); c.fillStyle = col; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(tk.s, cx, y + 7 + (li + 1) * LH - 5); cx += tk.w; }
  });

  c.font = sans(400, 11.5); c.fillStyle = meta; c.textAlign = 'right'; c.textBaseline = 'alphabetic';
  const tx = x + it.w - 10 - (out ? 18 : 0); c.fillText(it.time, tx, y + it.h - 5);
  if (out) {
    c.strokeStyle = meta; c.lineWidth = 1.5; c.lineCap = 'round'; c.lineJoin = 'round';
    c.save(); c.translate(tx + 2, y + it.h - 14); c.beginPath(); c.moveTo(1, 5.5); c.lineTo(3.8, 8.3); c.lineTo(9.5, 2.2); c.moveTo(6.5, 8.3); c.lineTo(12.5, 2.2); c.stroke(); c.restore();

const E2 = x => x * x * (3 - 2 * x);
const keyGone = (it, k, t) => { const tp = it.taps.find(q => q.i === k); return tp ? E2(P(t, tp.t + .12, tp.t + .34)) : 0; };

function chatColumn(c, items, x, bottom, colW, t, theme) {

    const it = items[i]; if (t < it.t0) continue;

function drawItem(c, it, x, y, t, theme, colW) {

    c.fillStyle = night ? T.tgnIn : T.tgIn; rr(c, x, y, it.w, it.h, [17, 17, 17, 5]); c.fill(); c.restore();
    for (let k = 0; k < 3; k++) { const ph = ((t - it.t0 - k * .16) % 1 + 1) % 1, b = Math.sin(ph * Math.PI);

// Perry's mascot: the site's teal platypus in a fedora (site/components/mascot/Platypus.tsx),
// drawn from the same paths in its 240 x 262 box. One ink outline, flat colour, one shadow tone.
const PLAT = {
  teal: '#26b5a9', tealDark: '#1b8e85', bill: '#f5a13a', billDark: '#d9822a', hat: '#4b3326', band: '#2a1c15', crease: '#6a4a37', line: '#123f3b',
  tail: new Path2D('M160 208c34-10 64 2 66 18 2 17-26 24-62 14z'),
  body: new Path2D('M58 152c0-46 28-70 62-70s62 24 62 70v50c0 30-26 42-62 42s-62-12-62-42z'),
  shade: new Path2D('M150 92c20 12 32 32 32 60v50c0 30-26 42-62 42 34-6 44-30 44-60v-44c0-20-4-36-14-48z'),
  armL: new Path2D('M62 164c-10 6-14 22-8 34 3 6 10 6 13 0'),
  armR: new Path2D('M178 164c10 6 14 22 8 34-3 6-10 6-13 0'),
  billShape: new Path2D('M70 148c0-12 24-17 50-17s50 5 50 17c0 15-22 21-50 21s-50-6-50-21z'),
  billLine: new Path2D('M80 156c14 6 66 6 80 0'),

  crease: new Path2D('M100 62c6 2 34 2 40 0'),

// o: blink 0..1 (1 is shut), look [x, y] in -1..1, hatLift in box units
function platypus(c, o = {}) {

  const inkPath = pth => { c.strokeStyle = P_.line; c.lineWidth = 3.2; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(pth); };

// The mascot centred on (x, y) with his body s wide. Options as before: bob, squash, blink, look, pulse (now a hat hop).
function mascot(c, x, y, s, t = 0, o = {}) {
  const k = s / 124, bob = o.bob ? Math.sin(t * 4.2) * s * .025 : 0, squash = o.squash || 0;
  c.save(); c.translate(x, y + bob); c.scale(1 + squash * .12, 1 - squash * .12);

const MONT_BG = [[T.paper, T.ink, T.ink3], [T.mist, T.ink, T.ink3], ['#1d1d1f', '#fff', '#a1a1a6'], [T.teal, '#fff', 'rgba(255,255,255,.75)']];
function sMontage(c, t, lt) {

// ============================================================================
//  S12 — end card (2 bars)
// ============================================================================
function sEnd(c, t, lt) {

  springIn(c, lt, 0, 720, 200, () => mascot(c, 720, 202, 116, lt, { bob: lt > 1, squash: land, pulse: beatK(lt) * (1 - P(lt, BAR, 2 * BAR)), blink: blinkAt(lt, 2.2, 1.4), look: [0, .15] }));
  words(c, 'Perry', 720, 430, 150, lt, .15, { align: 'center', st: 0 });
  words(c, 'Your personal AI. On your machine.', 720, 496, 30, lt, .5, { align: 'center', color: T.ink3, w: 500, track: .01, st: .03 });

// ============================================================================
//  timeline: hard cuts on the bar lines
// ============================================================================
const SCENES = [[0, sHook], [1, sLogo], [2, sPromise], [3, sChat], [6, sConnect], [7, sMemory], [8, sComputer], [9, sActivity], [10, sHeart], [12, sPrivate], [13, sMontage], [15, sEnd]].map(([b, f]) => [b * BAR, f]);
const sceneAt = t => { let i = SCENES.length - 1; while (i > 0 && t < SCENES[i][0]) i--; return i; };
function drawScene(c, t) {
  const i = sceneAt(t), [s0, f] = SCENES[i];
  c.save(); c.setTransform(K, 0, 0, K, 0, 0); c.globalAlpha = 1; c.filter = 'none'; c.letterSpacing = '0px';
  f(c, t, t - s0); c.restore();
}
function renderFrame(t, sub = SUB) {
  if (sub <= 1) { drawScene(out, t); return; }
  const shutter = .5 / FPS;
  for (let s = 0; s < sub; s++) {
    let ts = t + shutter * (s / sub - .5); if (sceneAt(ts) !== sceneAt(t)) ts = t;
    drawScene(sctx, ts); out.globalAlpha = 1 / (s + 1); out.drawImage(scratch, 0, 0);
  }
  out.globalAlpha = 1;
}

// ============================================================================
//  SCORE — 128 BPM, Am–F–C–G, sidechained; UI foley on the same clock
// ============================================================================
async function renderAudio() {
  const SR = 48000, ac = new OfflineAudioContext(2, Math.ceil(SR * DUR), SR);
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const master = ac.createGain(); master.gain.value = .9; master.gain.setValueAtTime(.9, DUR - .7); master.gain.linearRampToValueAtTime(0, DUR);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .12;
  const trim = ac.createGain(); trim.gain.value = .62;
  master.connect(comp).connect(trim).connect(ac.destination);
  const ir = ac.createBuffer(2, SR * 2, SR); for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 3); }

  const nb = ac.createBuffer(1, SR * 2, SR); { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const music = ac.createGain(); music.connect(master);
  const pump = ac.createGain(); pump.connect(music);
  const env = (t, a, v, d, dest) => { const g = ac.createGain(); g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); g.connect(dest); return g; };

  const send = (g, a) => { const s = ac.createGain(); s.gain.value = a; g.connect(s).connect(rev); };
  const noise = (t, dur, type, f, v, { f2, q = .8, a = .001, dest = master, rv = 0 } = {}) => {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + a + dur);
    const g = env(t, a, v, dur, dest); s.connect(fl).connect(g); if (rv) send(g, rv); s.start(t, rnd()); s.stop(t + a + dur + .1);
  };
  const swell = (t, dur, f1, f2, v) => {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 1.2;
    fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain(); g.gain.value = 0; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + dur * .93); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(fl).connect(g).connect(master); send(g, .3); s.start(t); s.stop(t + dur + .02);
  };
  const kickS = (t, v = 1) => { const o = osc('sine', 160, t, .4); o.frequency.exponentialRampToValueAtTime(44, t + .12); o.connect(env(t, .002, v, .34, master)); noise(t, .012, 'highpass', 3000, v * .3);
    pump.gain.setValueAtTime(.25, t); pump.gain.linearRampToValueAtTime(1, t + BT * .7); };
  const clap = (t, v = .45) => { for (const o of [0, .01, .02]) noise(t + o, .02, 'bandpass', 1500, v * .6, { q: 1.3 }); noise(t + .03, .15, 'bandpass', 1400, v, { rv: .4 }); };
  const hat = (t, v = .06) => noise(t, .035, 'highpass', 8500, v);
  const bass = (t, m, dur, v = .32) => { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 5; fl.frequency.setValueAtTime(1200, t); fl.frequency.exponentialRampToValueAtTime(180, t + dur);
    const g = env(t, .006, v, dur, pump); fl.connect(g); osc('sawtooth', mf(m), t, dur).connect(fl); osc('sine', mf(m) / 2, t, dur).connect(g); };
  const pluck = (t, m, v = .05) => { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 2; fl.frequency.setValueAtTime(5200, t); fl.frequency.exponentialRampToValueAtTime(400, t + .2);
    const g = env(t, .002, v, .24, pump); fl.connect(g); send(g, .3); for (const det of [-7, 7]) { const o = osc('sawtooth', mf(m), t, .3); o.detune.value = det; o.connect(fl); } };
  const stab = (t, notes, v = .05, len = 1.2) => { for (const m of notes) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(4000, t); fl.frequency.exponentialRampToValueAtTime(500, t + len);
    const g = env(t, .004, v, len, music); fl.connect(g); send(g, .6); for (const det of [-10, 0, 10]) { const o = osc('sawtooth', mf(m), t, len); o.detune.value = det; o.connect(fl); } } };
  const pad = (t, dur, notes, v = .02) => { for (const m of notes) { const o = osc('triangle', mf(m), t, dur); const g = ac.createGain(); g.gain.value = 0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + dur * .4); g.gain.linearRampToValueAtTime(0, t + dur); o.connect(g).connect(pump); send(g, .5); } };
  const impact = (t, v = 1) => { kickS(t, v); const o = osc('sine', 60, t, 1.4); o.frequency.exponentialRampToValueAtTime(30, t + 1.2); o.connect(env(t, .005, .5 * v, 1.2, master)); noise(t, 1, 'lowpass', 2400, .28 * v, { f2: 160, rv: .6 }); };
  const tick = (t, v = .06) => noise(t, .01, 'highpass', 3500 + rnd() * 2000, v);
  const popS = (t, f = 700, v = .16) => { const o = osc('sine', f, t, .14); o.frequency.exponentialRampToValueAtTime(f * 1.7, t + .06); o.connect(env(t, .002, v, .1, master)); };

  const sendS = t => { noise(t, .1, 'bandpass', 900, .08, { f2: 3200, q: 1.1, a: .03 }); osc('sine', 700, t + .05, .08).connect(env(t + .05, .002, .07, .07, master)); };
  const click = (t, v = .25) => { noise(t, .012, 'bandpass', 2400, v, { q: 2 }); popS(t + .005, 1100, .08); };
  const thud = (t, v = .7) => { kickS(t, v); noise(t, .08, 'lowpass', 900, .3); };

  const at = (bar, beat = 0) => bar * BAR + beat * BT;
  const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], RT = [33, 29, 36, 31];
  // bar 0: the hook
  thud(at(0), .8); thud(at(0, 1), .8); thud(at(0, 2), .9);
  for (let s = 0; s < 8; s++) hat(at(0) + s * BT / 2, .03);
  swell(at(0, 3.1), BT * .9, 5000, 300, .15); swell(at(0, 2.8), BT * 1.2, 300, 9000, .3);
  // bar 1: the name
  impact(at(1), 1); stab(at(1), [57, 64, 69, 72, 76], .045, 1.6); whoosh(at(1) - .05, .12);
  for (let j = 1; j < 4; j++) kickS(at(1, j), .8);
  // bars 2–11: the groove, from the promises through the night watch
  for (let bar = 2; bar <= 11; bar++) {
    const k = (bar - 2) % 4;
    for (let j = 0; j < 4; j++) { kickS(at(bar, j), .95); if (j % 2) clap(at(bar, j)); hat(at(bar, j + .5), .07); hat(at(bar, j + .25), .025); hat(at(bar, j + .75), .025); }
    for (let e = 0; e < 8; e++) bass(at(bar, e / 2), RT[k] + (e % 2 ? 12 : 0), BT * .45, e % 2 ? .22 : .3);
    pad(at(bar), BAR, CH[k].map(n => n + 12), .018);
    if (bar >= 3) for (let s = 0; s < 16; s++) pluck(at(bar) + s * BT / 4, CH[k][[0, 1, 2, 1, 0, 2, 1, 2][s % 8]] + 24, s % 4 ? .03 : .045);
    if (![4, 5, 11].includes(bar)) whoosh(at(bar) - .1, .08);
  }
  // bar 12: breakdown under "Self-hosted."
  kickS(at(12), .9); kickS(at(12, 2), .7); pad(at(12), BAR, [57, 64, 69, 72], .03);
  swell(at(12, 1), BAR - BT, 300, 8000, .3);

  for (let s = 0; s < 16; s++) clap(at(14) + s * BT / 4, .06 + s * .018);
  // bars 15–17: the end card, and time to read it
  impact(at(15), 1.1); stab(at(15), [45, 57, 60, 64, 67, 71], .05, 3);
  for (let j = 1; j < 8; j++) { kickS(at(15, j), j < 4 ? .7 : .45); hat(at(15, j + .5), .04); }
  pad(at(15), 3 * BAR, [60, 64, 67, 71], .025);
  // foley, locked to the picture
  const c0 = at(3);
  for (let k = 0; k < 43; k += 2) tick(c0 + .6 + k / 45, .045);
  CHAT_ITEMS.forEach(it => { const t = c0 + it.t0; if (it.kind === 'bubble') it.side === 'out' ? sendS(t) : recvS(t); else if (it.kind === 'pill') popS(t, 1320, .05); else if (it.kind === 'keys') { popS(t, 990, .05); click(c0 + it.press.t); } });
  swell(c0 + 3.3, .35, 6000, 800, .12);
  for (let k = 0; k < 3; k++) tick(c0 + 3.9 + k * .03, .05);
  popS(at(1) + .05, 520, .1);
  for (let k = 0; k < 8; k++) popS(at(6) + .08 + k * .035, 500 + k * 70, .05);
  for (let k = 0; k < 23; k += 2) tick(at(7) + .25 + k / 40);
  popS(at(7) + .9, 950, .14); for (let k = 0; k < 3; k++) whoosh(at(7) + 1.0 + k * .08, .05, .15);
  for (let k = 0; k < 7; k++) tick(at(8) + .15 + k * .13, .05);
  popS(at(8) + .92, 520); click(at(8) + 1.38); popS(at(8) + 1.42, 1000, .12);
  for (let k = 0; k < 7; k++) popS(at(9) + .22 + k * .1, 800 + k * 60, .05);
  for (let j = 0; j < 8; j++) { const o = osc('sine', 1760, at(10, j), .08); o.connect(env(at(10, j), .002, .06, .07, master)); }
  recvS(at(10) + 1.1, .1);
  click(at(12) + .55, .3);
  popS(at(15) + .05, 520, .1); popS(at(15) + 1.1, 700, .08);
  return await ac.startRendering();
}
function wavBase64(buf) {
  const n = buf.length, ch = buf.numberOfChannels, sr = buf.sampleRate;
  const ab = new ArrayBuffer(44 + n * ch * 2), v = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));

  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const chans = [...Array(ch)].map((_, i) => buf.getChannelData(i));

// ============================================================================
//  boot
// ============================================================================
window.ready = (async () => {
  await Promise.all(['400 20px InterTight', '500 20px InterTight', '600 20px InterTight', '400 20px JBMono', '500 20px JBMono'].map(f => document.fonts.load(f)));
  await (PATTERN.complete ? Promise.resolve() : new Promise(r => { PATTERN.onload = r; PATTERN.onerror = r; }));
  window.renderFrame = renderFrame;
  window.frameDataURL = (t, sub) => { renderFrame(t, sub); return view.toDataURL('image/png'); };
  window.audioWav = async () => wavBase64(await renderAudio());
  if (new URLSearchParams(location.search).has('render')) { document.getElementById('hint').remove(); return true; }
  renderFrame(0, 1);
  let actx, buffer, src, startAt = 0, offset = 0, playing = false;
  const play = async () => {
    if (!actx) { actx = new AudioContext(); buffer = await renderAudio(); }
    src = actx.createBufferSource(); src.buffer = buffer; src.connect(actx.destination);
    src.start(0, offset); startAt = actx.currentTime - offset; playing = true;
    src.onended = () => { if (playing && actx.currentTime - startAt >= DUR - .05) { playing = false; offset = 0; } };
  };
  const pause = () => { if (!playing) return; offset = actx.currentTime - startAt; playing = false; src.onended = null; src.stop(); };
  view.onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { pause(); offset = clamp(offset + (e.code === 'ArrowRight' ? 1 : -1) / FPS, 0, DUR); renderFrame(offset, 1); }
  });
  const loop = () => { if (playing) renderFrame(Math.min(DUR - 1e-3, actx.currentTime - startAt), 1); requestAnimationFrame(loop); };
  loop();
  return true;
})();
